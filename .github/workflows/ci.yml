name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (Next.js + Drizzle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --dir src

      - name: Drizzle migration diff check
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npx drizzle-kit generate --name ci-check --dry-run || true

      - name: Build (strict)
        env:
          NEXTAUTH_SECRET: ci-secret-only
          AUTH_SECRET: ci-secret-only
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          STRICT_BUILD: "true"
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  android:
    name: Android APK (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apk/**/*.gradle*', 'apk/**/gradle-wrapper.properties') }}

      - name: Build debug APK
        working-directory: apk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
