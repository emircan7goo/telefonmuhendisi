# coturn - Telefon Mühendisi TURN sunucusu
# HMAC-SHA1 time-limited credentials (RFC 5766) — /api/v1/turn/credentials üretiyor.

listening-port=3478
tls-listening-port=5349

# Public IP'ni buraya yaz veya external-ip / relay-ip kullan
# external-ip=1.2.3.4

# Media relay port aralığı — firewall'da 49160-49200/udp açık olmalı
min-port=49160
max-port=49200

# Uzun-vadeli kullanıcı yerine geçici HMAC key. TURN_STATIC_AUTH_SECRET .env'de ayarlanır.
use-auth-secret
# static-auth-secret env üzerinden compose ile inject edilirse override:
# static-auth-secret=<inject via env>

realm=telefonmuhendisi.local

# Anonymous STUN'ı kapat, sadece kimlik doğrulanmış TURN'a izin ver
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

fingerprint

# Log seviyesi
verbose
log-file=stdout
